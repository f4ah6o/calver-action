name: Unofficial CalVer

description: Compute and optionally create a configurable CalVer release tag from the workflow runtime date and existing Git tags.
author: f4ah6o

inputs:
  format:
    description: CalVer format using YYYY, YY, 0Y, MM, 0M, WW, 0W, DD, 0D and optional PATCH.
    required: false
    default: YYYY.MM.PATCH
  timezone:
    description: IANA timezone used to determine the workflow runtime calendar date.
    required: false
    default: UTC
  prefix:
    description: Optional prefix for newly allocated immutable release tags. Empty means tags like 2026.8.0.
    required: false
    default: ''
  legacy_prefixes:
    description: Comma-separated legacy prefixes to consider during allocation without using them for new tags.
    required: false
    default: ''
  date:
    description: Optional YYYY-MM-DD override for deterministic runs and tests. Defaults to the workflow runtime date.
    required: false
    default: ''
  fetch_tags:
    description: Fetch and force-refresh tags from origin before allocating a version.
    required: false
    default: 'true'
  create_tag:
    description: Create and push the allocated immutable release tag.
    required: false
    default: 'false'
  target:
    description: Git object to tag. Defaults to GITHUB_SHA, then HEAD.
    required: false
    default: ''
  retries:
    description: Maximum allocation attempts when create_tag is true and another release wins the same PATCH concurrently.
    required: false
    default: '5'

outputs:
  version:
    description: Allocated CalVer without a tag prefix.
  tag:
    description: Allocated immutable Git tag, including prefix when configured.
  year:
    description: Four-digit Gregorian release year.
  month:
    description: Numeric release month without zero padding.
  week:
    description: Numeric week since the start of the release year without zero padding.
  day:
    description: Numeric day of month without zero padding.
  patch:
    description: Numeric PATCH sequence for formats containing PATCH; empty otherwise.

runs:
  using: node24
  main: src/index.js

branding:
  icon: calendar
  color: blue