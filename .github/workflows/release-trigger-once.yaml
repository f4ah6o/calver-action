name: Release calver-action from main once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-trigger-once.yaml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d52d460544cb0174c02020dcfae3f73b334fb3a8
          fetch-depth: 0

      - name: Verify pinned source is in main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "d52d460544cb0174c02020dcfae3f73b334fb3a8"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Pinned release source is no longer in main history."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate action
        run: npm run check

      - name: Allocate CalVer
        id: calver
        uses: ./
        with:
          format: YYYY.MM.PATCH
          timezone: Asia/Tokyo
          create_tag: false

      - name: Create CalVer tag and draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target d52d460544cb0174c02020dcfae3f73b334fb3a8 \
            --draft \
            --generate-notes \
            --title "$TAG"

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ steps.calver.outputs.version }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          {
            echo "## calver-action release draft"
            echo
            echo "- version: \`$VERSION\`"
            echo "- tag: \`$TAG\`"
            echo "- source: \`d52d460544cb0174c02020dcfae3f73b334fb3a8\`"
          } >> "$GITHUB_STEP_SUMMARY"
