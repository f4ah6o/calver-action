name: Finalize calver-action 2026.9.0 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-trigger-once.yaml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d52d460544cb0174c02020dcfae3f73b334fb3a8
          fetch-depth: 0

      - name: Verify pinned source is in main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "d52d460544cb0174c02020dcfae3f73b334fb3a8"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Pinned release source is no longer in main history."
            exit 1
          fi

      - name: Publish 2026.9.0 draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit 2026.9.0 --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Move latest to released main commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -f latest d52d460544cb0174c02020dcfae3f73b334fb3a8
          git push --force origin refs/tags/latest

      - name: Verify release tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --tags origin refs/tags/2026.9.0
          actual=$(git ls-remote --tags origin refs/tags/latest | awk '{print $1}')
          test "$actual" = "d52d460544cb0174c02020dcfae3f73b334fb3a8"
          test "$(gh release view 2026.9.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
