name: Release trigger (one-shot)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-trigger-once.yaml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move latest to selected release source
        shell: bash
        env:
          TARGET_SHA: d52d460544cb0174c02020dcfae3f73b334fb3a8
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git cat-file -e "${TARGET_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::Selected release source is not in main history."
            exit 1
          fi
          git tag -f latest "$TARGET_SHA"
          git push --force origin refs/tags/latest
